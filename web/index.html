<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pedidos, pagamentos e retirada sem filas na lanchonete da Faculdade FANS.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lanche Fácil">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/lanche-facil-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="lanche-facil-favicon.png">
  <link rel="shortcut icon" type="image/png" href="lanche-facil-favicon.png">

  <title>Lanche Fácil</title>
  <link rel="manifest" href="manifest.json?v=63">
  <style>
    /* Exibe retorno imediato enquanto o navegador baixa e inicializa o Flutter. */
    #app-loading {
      align-items: center;
      background: #101720;
      color: #f1f5fa;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      gap: 16px;
      inset: 0;
      justify-content: center;
      position: fixed;
    }

    /* Mostra a identidade oficial durante o carregamento e adapta seu tamanho à tela. */
    #app-loading-logo {
      border-radius: clamp(18px, 4vw, 34px);
      height: clamp(112px, 20vmin, 190px);
      object-fit: cover;
      width: clamp(112px, 20vmin, 190px);
    }

    /* A animação comunica atividade sem depender do código Flutter já carregado. */
    #app-loading-spinner {
      animation: loading-spin 0.8s linear infinite;
      border: 4px solid #344258;
      border-radius: 50%;
      border-top-color: #5aac44;
      height: 42px;
      width: 42px;
    }

    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Esta tela leve aparece antes do primeiro quadro produzido pelo Flutter. -->
  <div id="app-loading" role="status" aria-live="polite">
    <img id="app-loading-logo" src="icons/lanche-facil-192.png" alt="Identidade visual do Lanche Fácil">
    <div id="app-loading-spinner" aria-hidden="true"></div>
    <strong>Preparando o Lanche Fácil...</strong>
  </div>
  <script>
    // Remove a apresentação provisória assim que a interface Flutter estiver pronta.
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Inicia o Flutter imediatamente; o Hosting controla a atualização dos arquivos. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
